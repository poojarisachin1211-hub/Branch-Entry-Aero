<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e8"><title>Branch Entry · Scan & Play</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--ink:#18251f;--muted:#64736a;--paper:#f5f1e8;--green:#1c684b;--lime:#d6eb8b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px 'DM Sans',sans-serif}.wrap{max-width:880px;margin:auto;padding:28px 22px 70px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em;margin-bottom:62px}.mark{width:38px;height:38px;background:var(--green);color:var(--lime);border-radius:12px;display:grid;place-items:center;font-size:20px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--green)}h1{font:800 clamp(42px,7vw,76px)/.99 'Playfair Display',serif;letter-spacing:-.045em;margin:15px 0 20px}.intro{font-size:17px;line-height:1.6;color:#59675e;max-width:620px;margin-bottom:34px}.message{position:relative;overflow:hidden;background:var(--green);color:white;border-radius:30px;padding:clamp(30px,7vw,76px);min-height:400px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 18px 60px #17271c12}.message:after{content:'✳';position:absolute;right:-12px;bottom:-110px;font-size:320px;color:#ffffff10;line-height:1}.message.saved{background:#f1d987;color:#282d20}.message.saved .eyebrow{color:#546137}.message.saved p{color:#414333}.message.saved:after{color:#ffffff25}.message .eyebrow{color:var(--lime)}h2{position:relative;z-index:1;font:700 clamp(34px,5.5vw,60px)/1.07 'Playfair Display',serif;max-width:760px;margin:20px 0}.message p{position:relative;z-index:1;font-size:17px;line-height:1.6;color:#e4eee6;max-width:600px;margin:0}.badge{position:absolute;top:24px;right:26px;border:1px solid #ffffff55;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.saved .badge{border-color:#5a623855}.hint{margin-top:24px;font-size:13px;color:var(--muted);line-height:1.6}@media(max-width:600px){.wrap{padding:22px 16px}.brand{margin-bottom:42px}.message{min-height:360px}}
</style></head>
<body><main class="wrap"><header class="brand"><div class="mark">枝</div><span>BRANCH ENTRY</span></header><div class="eyebrow">A little courage. A lot of laughs.</div><h1>Your Branch Entry starts here.</h1><p class="intro">Scan the card, reveal your challenge, and make your entrance. The room is ready for you.</p><section id="reveal"></section><p class="hint">There are no wrong moves. Well… there are a few. But they usually make the best stories.</p></main>
<script>
const p=new URLSearchParams(location.search),card=p.get('card');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.querySelector('#reveal');
function waiting(){root.innerHTML=`<article class="message"><span class="badge">${esc(card||'INVITATION')}</span><div class="eyebrow">Still under wraps</div><h2>You scanned this too soon 🤐<br>The QR knows what’s coming. The QR is choosing silence.</h2><p>Come back on Branch Entry day and scan your card again.</p></article>`}
function reveal(data){if(data.type==='saved')root.innerHTML=`<article class="message saved"><span class="badge">${esc(card||'SAVED CARD')}</span><div class="eyebrow">A very exclusive prize</div><h2>🏆 CONGRATULATIONS!<br>You've won absolutely nothing.</h2><p>Still, you showed up. That counts for something.</p></article>`;else if(data.task)root.innerHTML=`<article class="message"><span class="badge">${esc(card||'YOUR CHALLENGE')}</span><div class="eyebrow">Your Branch Entry challenge</div><h2>${esc(data.task)}</h2><p>${esc(data.detail||'Your moment is now. Give it a go!')}</p></article>`;else waiting()}
if(!card)root.innerHTML='<article class="message"><div class="eyebrow">Ready when you are</div><h2>Scan your invitation card to reveal your challenge.</h2><p>Each card has its own little surprise. Find an organiser if you need a hand.</p></article>';
else{waiting();fetch(new URL(`assignments.json?check=${Date.now()}`,location.href),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('not released');return r.json()}).then(data=>{if(data.cards&&data.cards[card])reveal(data.cards[card])}).catch(()=>{});}
</script></body></html>
