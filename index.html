<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11131a"><title>Branch Entry · Classified</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
:root{--ink:#f3efdf;--muted:#9c9ba0;--night:#11131a;--panel:#191c25;--line:#353945;--gold:#e5c16a;--red:#ec685b;--teal:#83d1bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 12%,#33303a 0,#191b23 30%,var(--night) 75%);color:var(--ink);font:16px 'DM Sans',sans-serif;min-height:100vh}.wrap{max-width:960px;margin:auto;padding:26px 22px 64px}.brand{display:flex;align-items:center;gap:12px;font:600 12px 'DM Mono',monospace;letter-spacing:.16em;color:#d5d2c8;margin-bottom:66px}.mark{width:42px;height:42px;background:var(--gold);color:#211f1c;border-radius:50%;display:grid;place-items:center;font:700 20px 'DM Sans';box-shadow:0 0 22px #e5c16a33}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font:500 11px 'DM Mono',monospace;color:var(--gold)}h1{font:700 clamp(42px,7vw,78px)/.98 'Playfair Display',serif;letter-spacing:-.04em;margin:16px 0 20px;max-width:760px}.intro{font-size:16px;line-height:1.7;color:#b6b4b1;max-width:620px;margin-bottom:34px}.message{position:relative;overflow:hidden;background:linear-gradient(140deg,#20232e,#15171e 70%);color:var(--ink);border:1px solid #666054;border-radius:6px;padding:clamp(30px,7vw,76px);min-height:400px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 24px 70px #0008}.message:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 15px,#ffffff04 16px 17px);pointer-events:none}.message:after{content:'CLASSIFIED';position:absolute;right:-20px;bottom:12px;transform:rotate(-18deg);font:500 clamp(38px,8vw,84px) 'DM Mono',monospace;letter-spacing:.08em;color:#e5c16a0b;pointer-events:none}.message.saved{background:linear-gradient(140deg,#423c28,#222119);border-color:#a68b4d}.message.saved .eyebrow{color:var(--gold)}.message.saved p{color:#ded4b3}.message .eyebrow{color:var(--teal)}h2{position:relative;z-index:1;font:700 clamp(34px,5.5vw,59px)/1.08 'Playfair Display',serif;max-width:790px;margin:22px 0}.message p{position:relative;z-index:1;font-size:16px;line-height:1.7;color:#c2c0c0;max-width:610px;margin:0}.badge{position:absolute;top:22px;right:24px;border:1px solid #e5c16a80;border-radius:2px;padding:8px 11px;font:500 10px 'DM Mono',monospace;letter-spacing:.12em;color:var(--gold)}.saved .badge{border-color:#e5c16a80}.hint{margin-top:23px;font:12px 'DM Mono',monospace;letter-spacing:.04em;color:var(--muted);line-height:1.7}.message .eyebrow:before{content:'●';font-size:8px;margin-right:9px;color:var(--red)}@media(max-width:600px){.wrap{padding:20px 16px}.brand{margin-bottom:46px}.message{min-height:370px}.badge{top:15px;right:15px}}
</style></head>
<body><main class="wrap"><header class="brand"><div class="mark">枝</div><span>BRANCH ENTRY&nbsp; / &nbsp;DOSSIER 051</span></header><div class="eyebrow">A confidential notice has been prepared</div><h1>Some things are better left sealed.</h1><p class="intro">Your invitation has brought you to the right file. Its contents remain restricted until the organiser opens it.</p><section id="reveal"></section><p class="hint">BRANCH ENTRY · KEEP THIS FILE CLOSE · DO NOT ATTEMPT TO BRIBE THE QR</p></main>
<script>
const p=new URLSearchParams(location.search),card=p.get('card');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=document.querySelector('#reveal');
function waiting(){root.innerHTML=`<article class="message"><span class="badge">${esc(card||'INVITATION')}</span><div class="eyebrow">Still under wraps</div><h2>You scanned this too soon 🤐<br>The QR knows what’s coming. The QR is choosing silence.</h2><p>Come back on Branch Entry day and scan your card again.</p></article>`}
function reveal(data){if(data.type==='saved')root.innerHTML=`<article class="message saved"><span class="badge">${esc(card||'SAVED CARD')}</span><div class="eyebrow">A very exclusive prize</div><h2>🏆 CONGRATULATIONS!<br>You've won absolutely nothing.</h2><p>Still, you showed up. That counts for something.</p></article>`;else if(data.task)root.innerHTML=`<article class="message"><span class="badge">${esc(card||'YOUR CHALLENGE')}</span><div class="eyebrow">Your Branch Entry challenge</div><h2>${esc(data.task)}</h2><p>${esc(data.detail||'Your moment is now. Give it a go!')}</p></article>`;else waiting()}
if(!card)root.innerHTML='<article class="message"><div class="eyebrow">Ready when you are</div><h2>Scan your invitation card to reveal your challenge.</h2><p>Each card has its own little surprise. Find an organiser if you need a hand.</p></article>';
else{waiting();fetch(new URL(`assignments.json?check=${Date.now()}`,location.href),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('not released');return r.json()}).then(data=>{if(data.cards&&data.cards[card])reveal(data.cards[card])}).catch(()=>{});}
</script></body></html>
